<body>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 340px;
    height: 200px;
    background: #0a0f1a;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: #c8d6e5;
    overflow: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.05) 0px,
      rgba(0, 0, 0, 0.05) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 999;
  }

  body::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.35) 100%);
    pointer-events: none;
    z-index: 998;
  }

  #panel {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(96, 165, 250, 0.2);
    margin-bottom: 10px;
  }

  #header .brand {
    color: #60a5fa;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(96, 165, 250, 0.4);
  }

  #header .status {
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  #header .status.online {
    color: #34d399;
    text-shadow: 0 0 6px rgba(52, 211, 153, 0.5);
  }

  #header .status.offline {
    color: #f87171;
    text-shadow: 0 0 6px rgba(248, 113, 113, 0.4);
  }

  #grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1;
  }

  .card {
    flex: 1 1 calc(50% - 4px);
    min-width: 140px;
    background: rgba(96, 165, 250, 0.04);
    border: 1px solid rgba(96, 165, 250, 0.1);
    border-radius: 2px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card .label {
    font-size: 9px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .card .value {
    font-size: 18px;
    font-weight: bold;
    color: #e2e8f0;
  }

  .card .value.ok { color: #34d399; }
  .card .value.warn { color: #fbbf24; }
  .card .value.err { color: #f87171; }

  .card .sub {
    font-size: 9px;
    color: #64748b;
    margin-top: 2px;
  }

  #progress-area {
    margin-top: 8px;
  }

  #progress-track {
    width: 100%;
    height: 3px;
    background: rgba(96, 165, 250, 0.1);
    border-radius: 1px;
    overflow: hidden;
  }

  #progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #60a5fa, #93c5fd);
    box-shadow: 0 0 6px rgba(96, 165, 250, 0.5);
    transition: width 0.3s ease;
  }

  @keyframes glow-pulse {
    0%, 100% { border-color: rgba(96, 165, 250, 0.1); }
    50% { border-color: rgba(96, 165, 250, 0.3); }
  }

  .card {
    animation: glow-pulse 3s ease-in-out infinite;
  }
</style>

<div id="panel">
  <div id="header">
    <span class="brand">SRELab LIGHTING CONTROL v1.0</span>
    <span class="status online" id="sys-status">ONLINE</span>
  </div>

  <div id="grid">
    <div class="card">
      <div class="label">Terminals</div>
      <div class="value ok" id="term-count">3/3</div>
      <div class="sub">All terminals active</div>
    </div>
    <div class="card">
      <div class="label">Lamps</div>
      <div class="value ok" id="lamp-count">4</div>
      <div class="sub">Connected lamps</div>
    </div>
    <div class="card">
      <div class="label">Power</div>
      <div class="value ok" id="power-status">OK</div>
      <div class="sub">Redstone signal: 15</div>
    </div>
    <div class="card">
      <div class="label">Lighting</div>
      <div class="value ok" id="light-status">ON</div>
      <div class="sub">All lamps lit</div>
    </div>
  </div>

  <div id="progress-area">
    <div id="progress-track">
      <div id="progress-fill" style="width:100%"></div>
    </div>
  </div>
</div>

<script>
  var progressFill = document.querySelector('#progress-fill');
  var sysStatus = document.querySelector('#sys-status');

  function animateProgress() {
    var w = 0;
    var interval = setInterval(function() {
      w += 2;
      progressFill.style.width = w + '%';
      if (w >= 100) {
        clearInterval(interval);
        sysStatus.classList.remove('offline');
        sysStatus.classList.add('online');
        sysStatus.innerText = 'ONLINE';
      }
    }, 20);
  }

  // Start animation
  sysStatus.classList.remove('online');
  sysStatus.classList.add('offline');
  sysStatus.innerText = 'LOADING';
  animateProgress();
</script>
</body>
